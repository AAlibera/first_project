# PCB缺陷检测系统 - Docker Compose配置
version: '3.8'

services:
  # 后端API服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcb-detection-backend
    ports:
      - "8000:8000"
    volumes:
      # 挂载模型目录
      - ./models:/app/models
      # 挂载静态文件目录
      - ./static:/app/static
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - pcb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pcb-network:
    driver: bridge
